<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice AI Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0f172a; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 25px; border-radius: 16px; text-align: center; width: 85%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    button { background: #3b82f6; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 18px; cursor: pointer; margin-top: 20px; transition: 0.2s; }
    button:active { transform: scale(0.95); }
    .status { margin-top: 15px; font-size: 14px; color: #94a3b8; }
    .reply { margin-top: 20px; font-weight: bold; color: #38bdf8; min-height: 50px; }
  </style>
</head>
<body>

<div class="card">
  <h2>🎙️ Voice Assistant</h2>
  <p class="status" id="status">Bolein button dabayein</p>
  <button id="micBtn" onclick="startListening()">🎤 BaaT Karein</button>
  <div class="reply" id="replyText"></div>
</div>

<script>
  // Conversation History Maintain Karne Ke Liye
  let conversationHistory = [];

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (!SpeechRecognition) {
    document.getElementById("status").innerText = "Aapke browser me speech recognition support nahi hai.";
  } else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'hi-IN';

    function startListening() {
      document.getElementById("status").innerText = "Suno... Boliyee!";
      document.getElementById("replyText").innerText = "";
      recognition.start();
    }

    recognition.onresult = async function(event) {
      const userText = event.results[0][0].transcript;
      document.getElementById("status").innerText = `Aapne kaha: "${userText}"`;
      document.getElementById("replyText").innerText = "Soch raha hu...";

      // Conversation Array Update Karein
      conversationHistory.push({
        role: "user",
        parts: [{ text: userText }]
      });

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history: conversationHistory })
        });

        const data = await response.json();

        if (data.reply) {
          document.getElementById("replyText").innerText = data.reply;

          // Model Reply Ko History Me Save Karein
          conversationHistory.push({
            role: "model",
            parts: [{ text: data.reply }]
          });
          
          // Base64 Audio Playback Fix
          if (data.audio) {
            const audioSource = "data:audio/mp3;base64," + data.audio;
            const audio = new Audio(audioSource);
            audio.play();
            document.getElementById("status").innerText = "Jawab suniye...";
          } else {
            document.getElementById("status").innerText = "Text reply mil gaya.";
          }
        } else {
          document.getElementById("status").innerText = data.error || "Kuchh gadbad hui!";
        }
      } catch (err) {
        document.getElementById("status").innerText = "Error aagaya connection me.";
      }
    };
  }
</script>

</body>
</html>
